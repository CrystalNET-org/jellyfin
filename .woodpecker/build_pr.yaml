# Test-build the image for pull requests (e.g. Renovate updates) without
# pushing it; Renovate only automerges once this passes.
when:
  - event: pull_request

steps:
  docker-build-test:
    image: woodpeckerci/plugin-docker-buildx:6.1.2
    settings:
      repo: jellyfin-test
      dockerfile: Dockerfile
      platforms: linux/amd64,linux/arm64
      dry_run: true
